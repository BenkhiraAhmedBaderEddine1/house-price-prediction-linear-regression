 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E5B5"/>
