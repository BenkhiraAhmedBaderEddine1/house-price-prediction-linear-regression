    <animateTransform attributeName="transform" type="translate" values="0 18;0 0;0 0;0 -8;0 18" dur="7s" repeatCount="indefinite"/>
    <g filter="url(#glow)" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round">
      <path d="M340 205 L500 85 L660 205" fill="none"/>
